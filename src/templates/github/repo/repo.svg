<svg width="400px" height="140" font-family="Segoe UI" xmlns="http://www.w3.org/2000/svg">
    <rect width="400" height="140" rx="6" fill="#0d1117" stroke="#3d444d" stroke-width="0.8" />
    <g transform="translate(16, 16)">
        <!-- profile avatar -->
        <clipPath id="avatar-clip">
            <rect width="20" height="20" rx="10" />
        </clipPath>

        <image clip-path="url(#avatar-clip)" height="20px" width="20px" href="${owner_avatar}" />
        <!-- owner username and repo name -->
        <text x="30" y="16" font-size="16" fill="#4493f8">
            react/<tspan font-weight="bold">react</tspan>
        </text>
        <!-- repo description -->
        <text x="0" y="40" font-weight="400" font-size="14" fill="white">
            The library for web and native user interfaces.
        </text>
        <!-- repo tags -->
        <g transform="translate(0, 54)">
            <g transform="translate(0,0)">
                <rect width="46" height="22" fill="#111d2e" rx="12" />
                <text x="10" y="14.5" font-size="12" fill="#4493f8">react</text>
            </g>
            <g transform="translate(54,0)">
                <rect width="70" height="22" fill="#111d2e" rx="12" />
                <text x="10" y="14.5" font-size="12" fill="#4493f8">javascript</text>
            </g>
        </g>
        <g transform="translate(0,90)">
            <!-- top language -->
            <circle cx="0" cy="0" r="5" fill="#f1e05a" />
            <text >Javascript</text>
        </g>
    </g>
</svg>